name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke

  pack-roundtrip:
    # Garante que o tarball publicável (npm pack) tem tudo que precisa
    # pra rodar via Node puro — pega bugs do build compilado (ex: require()
    # em ESM) que os smokes via tsx passam por cima.
    runs-on: ubuntu-latest
    needs: build-and-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: pack
        run: npm pack
      - name: install tarball globally
        run: npm install -g ./ctbz-code-*.tgz
      - name: smoke da CLI compilada
        run: |
          which ctbz
          ctbz-code state
          ctbz-code --help
